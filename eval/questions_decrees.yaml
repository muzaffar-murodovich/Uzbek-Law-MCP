# Retrieval evaluation on by-laws: government (VM) decisions, Presidential decrees and
# resolutions, ministry orders. None of these acts is in questions.yaml (codes and laws only).
# Written by the assistant from the full corpus (2026-11-09) by reading the acts; the expected
# band was chosen from the text, not from search results.
# Decrees repeat band numbers (the decree itself and each attached Nizom), so ``within`` names
# the part of the heading path the band must sit in; "" means the decree's own bands.
# Style tags: rasmiy (formal), sozlashuv (colloquial), xatoli (typos / no apostrophes).

