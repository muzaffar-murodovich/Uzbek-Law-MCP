# qonunshunos.muzaffar.zip → Qonunshunos MCP server (127.0.0.1:8100).
# Behind the Cloudflare proxy like the other sites on this server: UFW lets 80/443 in from
# Cloudflare only, and the origin uses the *.muzaffar.zip Cloudflare Origin CA certificate
# (SSL mode "Full (strict)").

log_format qonunshunos_path '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent $request_time "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=qonunshunos_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=qonunshunos_mcp:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name qonunshunos.muzaffar.zip;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qonunshunos.muzaffar.zip;

    ssl_certificate     /etc/ssl/certs/muzaffar.crt;
    ssl_certificate_key /etc/ssl/private/muzaffar.key;

    # The real client address (for rate limits and logs) comes from Cloudflare.
    # Ranges: https://www.cloudflare.com/ips/ (2026-11-06).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # OAuth query strings carry one-time codes: log the path only.
    access_log /var/log/nginx/qonunshunos.access.log qonunshunos_path;

    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;

    # Client registration and sign-in: a few per minute per IP is plenty.
    location ~ ^/(register|authorize|token|revoke|auth/) {
        limit_req zone=qonunshunos_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }

    location /mcp {
        limit_req zone=qonunshunos_mcp burst=20 nodelay;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
