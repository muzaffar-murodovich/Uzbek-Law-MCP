[project]
name = "qonunshunos"
version = "0.1.0"
description = "Remote MCP server for Uzbek legislation (source: lex.uz)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "mcp>=2.3",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pgvector>=0.3",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tokenizers>=0.19",
]

[project.scripts]
qonunshunos = "qonunshunos.cli:main"

[dependency-groups]
bench = [
    "sentence-transformers>=5.5.1",
    "torch>=2.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qonunshunos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Uzbek text legitimately contains ʻ ʼ ‘ ’ and similar characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL test database (QONUNSHUNOS_TEST_DSN)"]
